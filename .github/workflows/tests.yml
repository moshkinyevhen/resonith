name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  reference-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install runtime dependency
        run: python -m pip install numpy
      - name: Install real Opus anchor
        run: |
          sudo apt-get update
          sudo apt-get install -y opus-tools
      - name: Run reference tests
        env:
          RESONITH_OPUS_TOOLS: /usr/bin
        run: python -m unittest discover -s tests -v

  native-linux:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: GCC
            cc: gcc
            cxx: g++
          - name: Clang
            cc: clang
            cxx: clang++
    name: Native / Linux / ${{ matrix.name }}
    runs-on: ubuntu-latest
    env:
      CC: ${{ matrix.cc }}
      CXX: ${{ matrix.cxx }}
    steps:
      - uses: actions/checkout@v7
      - name: Configure
        run: >
          cmake -S native -B build/native
          -DCMAKE_BUILD_TYPE=Release
          -DRESONITH_WARNINGS_AS_ERRORS=ON
      - name: Build
        run: cmake --build build/native --parallel
      - name: Test
        run: ctest --test-dir build/native --output-on-failure

  native-windows:
    name: Native / Windows / MSVC
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - name: Configure
        run: >
          cmake -S native -B build/native
          -DRESONITH_WARNINGS_AS_ERRORS=ON
      - name: Build
        run: cmake --build build/native --config Release --parallel
      - name: Test
        run: >
          ctest --test-dir build/native
          --build-config Release
          --output-on-failure

  native-python-bridge:
    name: Native decoder-in-loop / Python
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install runtime dependency
        run: python -m pip install numpy
      - name: Build shared Golden Core
        run: |
          cmake -S native -B build/native \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_TESTING=OFF \
            -DRESONITH_WARNINGS_AS_ERRORS=ON
          cmake --build build/native --target resonith_core_shared --parallel
      - name: Run native decoder-in-loop tests
        env:
          RESONITH_NATIVE_CORE: ${{ github.workspace }}/build/native/libresonith_core_shared.so
        run: >
          python -m unittest discover
          -s tests
          -p test_native_bridge.py
          -v
