name: Tests

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  reference-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Install runtime dependency
        run: python -m pip install -r requirements-research.txt
      - name: Install real Opus anchor
        run: |
          sudo apt-get update
          sudo apt-get install -y opus-tools
      - name: Run reference tests
        env:
          RESONITH_OPUS_TOOLS: /usr/bin
        run: python -m unittest discover -s tests -v
      - name: Run R-191 independent pytest oracle
        env:
          PYTHONPATH: ${{ github.workspace }}/reference:${{ github.workspace }}
        run: >
          python -m pytest -q
          tests/test_partial_graph_fixed.py
          tests/test_r197_case_generator.py
          tests/test_r203_candidate_rich_generator.py
          tests/test_r203_compare_replays.py
      - name: Validate offline listening application
        run: node --check experiments/listening_app/app.js

  native-linux:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: GCC
            cc: gcc
            cxx: g++
          - name: Clang
            cc: clang
            cxx: clang++
    name: Native / Linux / ${{ matrix.name }}
    runs-on: ubuntu-latest
    env:
      CC: ${{ matrix.cc }}
      CXX: ${{ matrix.cxx }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Install R-203 replay dependency
        run: python -m pip install -r requirements-research.txt
      - name: Configure
        run: >
          cmake -S native -B build/native
          -DCMAKE_BUILD_TYPE=Release
          -DRESONITH_WARNINGS_AS_ERRORS=ON
          -DRESONITH_BUILD_SHARED=ON
      - name: Build
        run: cmake --build build/native --parallel
      - name: Test
        run: ctest --test-dir build/native --output-on-failure
      - name: Replay R-203 candidate-rich evidence
        env:
          PYTHONPATH: ${{ github.workspace }}/reference:${{ github.workspace }}
        run: |
          set -euo pipefail
          mkdir -p artifacts/r203-${{ matrix.name }}
          python experiments/r203_candidate_rich_gate.py \
            | tee artifacts/r203-${{ matrix.name }}/inventory.json
          python experiments/r197_partial_graph_native_gate.py \
            --corpus artifacts/r203/r203-candidate-rich-exact-v1.jsonl \
            --inventory artifacts/r203-${{ matrix.name }}/inventory.json \
            --native-core build/native/libresonith_core_shared.so \
            | tee artifacts/r203-${{ matrix.name }}/replay.json
      - name: Publish R-203 ${{ matrix.name }} replay
        uses: actions/upload-artifact@v7
        with:
          name: r203-candidate-rich-linux-${{ matrix.name }}
          path: artifacts/r203-${{ matrix.name }}
          if-no-files-found: error

  native-windows:
    name: Native / Windows / MSVC
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Install R-203 replay dependency
        run: python -m pip install -r requirements-research.txt
      - name: Configure
        run: >
          cmake -S native -B build/native
          -DRESONITH_WARNINGS_AS_ERRORS=ON
          -DRESONITH_BUILD_SHARED=ON
      - name: Build
        run: cmake --build build/native --config Release --parallel
      - name: Test
        run: >
          ctest --test-dir build/native
          --build-config Release
          --output-on-failure
      - name: Replay R-203 candidate-rich evidence
        shell: pwsh
        env:
          PYTHONPATH: ${{ github.workspace }}/reference;${{ github.workspace }}
        run: |
          New-Item -ItemType Directory -Force -Path artifacts/r203-msvc | Out-Null
          python experiments/r203_candidate_rich_gate.py |
            Tee-Object -FilePath artifacts/r203-msvc/inventory.json
          if ($LASTEXITCODE -ne 0) {
            throw "R-203 inventory producer failed with exit code $LASTEXITCODE"
          }
          python experiments/r197_partial_graph_native_gate.py `
            --corpus artifacts/r203/r203-candidate-rich-exact-v1.jsonl `
            --inventory artifacts/r203-msvc/inventory.json `
            --native-core build/native/Release/resonith_core_shared.dll |
            Tee-Object -FilePath artifacts/r203-msvc/replay.json
          if ($LASTEXITCODE -ne 0) {
            throw "R-203 replay producer failed with exit code $LASTEXITCODE"
          }
      - name: Publish R-203 MSVC replay
        uses: actions/upload-artifact@v7
        with:
          name: r203-candidate-rich-windows-msvc
          path: artifacts/r203-msvc
          if-no-files-found: error
      - name: Publish Windows x64 callback benchmark
        uses: actions/upload-artifact@v7
        with:
          name: resonith-device-bench-windows-x64
          path: build/native/Release/resonith_lapped_device_bench.exe
          if-no-files-found: error
      - name: Publish Windows x64 native decoder
        uses: actions/upload-artifact@v7
        with:
          name: resonith-decode-windows-x64
          path: build/native/Release/resonith_decode.exe
          if-no-files-found: error
      - name: Publish Windows x64 adaptive entropy benchmark
        uses: actions/upload-artifact@v7
        with:
          name: resonith-finite-bench-windows-x64
          path: build/native/Release/resonith_lapped_finite_bench.exe
          if-no-files-found: error

  native-linux-arm64:
    name: Native / Linux ARM64 / GCC
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Install R-203 replay dependency
        run: python -m pip install -r requirements-research.txt
      - name: Configure
        run: >
          cmake -S native -B build/native
          -DCMAKE_BUILD_TYPE=Release
          -DRESONITH_WARNINGS_AS_ERRORS=ON
          -DRESONITH_BUILD_SHARED=ON
      - name: Build
        run: cmake --build build/native --parallel
      - name: Test
        run: ctest --test-dir build/native --output-on-failure
      - name: Replay R-203 candidate-rich evidence
        env:
          PYTHONPATH: ${{ github.workspace }}/reference:${{ github.workspace }}
        run: |
          set -euo pipefail
          mkdir -p artifacts/r203-linux-arm64
          python experiments/r203_candidate_rich_gate.py \
            | tee artifacts/r203-linux-arm64/inventory.json
          python experiments/r197_partial_graph_native_gate.py \
            --corpus artifacts/r203/r203-candidate-rich-exact-v1.jsonl \
            --inventory artifacts/r203-linux-arm64/inventory.json \
            --native-core build/native/libresonith_core_shared.so \
            | tee artifacts/r203-linux-arm64/replay.json
      - name: Publish R-203 Linux ARM64 replay
        uses: actions/upload-artifact@v7
        with:
          name: r203-candidate-rich-linux-arm64-gcc
          path: artifacts/r203-linux-arm64
          if-no-files-found: error

  native-macos-arm64:
    name: Native / macOS ARM64 / AppleClang
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Install R-203 replay dependency
        run: python -m pip install -r requirements-research.txt
      - name: Configure
        run: >
          cmake -S native -B build/native
          -DCMAKE_BUILD_TYPE=Release
          -DRESONITH_WARNINGS_AS_ERRORS=ON
          -DRESONITH_BUILD_SHARED=ON
      - name: Build
        run: cmake --build build/native --parallel
      - name: Test
        run: ctest --test-dir build/native --output-on-failure
      - name: Replay R-203 candidate-rich evidence
        env:
          PYTHONPATH: ${{ github.workspace }}/reference:${{ github.workspace }}
        run: |
          set -euo pipefail
          mkdir -p artifacts/r203-appleclang
          python experiments/r203_candidate_rich_gate.py \
            | tee artifacts/r203-appleclang/inventory.json
          python experiments/r197_partial_graph_native_gate.py \
            --corpus artifacts/r203/r203-candidate-rich-exact-v1.jsonl \
            --inventory artifacts/r203-appleclang/inventory.json \
            --native-core build/native/libresonith_core_shared.dylib \
            | tee artifacts/r203-appleclang/replay.json
      - name: Publish R-203 AppleClang replay
        uses: actions/upload-artifact@v7
        with:
          name: r203-candidate-rich-macos-appleclang
          path: artifacts/r203-appleclang
          if-no-files-found: error

  r203-cross-toolchain:
    name: R-203 cross-toolchain semantic comparison
    needs:
      - native-linux
      - native-linux-arm64
      - native-windows
      - native-macos-arm64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - uses: actions/download-artifact@v8
        with:
          pattern: r203-candidate-rich-*
          path: artifacts/r203-replays
      - name: Require identical complete replay semantics
        run: |
          set -euo pipefail
          mapfile -t replays < <(
            find artifacts/r203-replays -type f -name replay.json | sort
          )
          python experiments/r203_compare_replays.py "${replays[@]}" \
            | tee artifacts/r203-cross-toolchain.json
      - name: Publish R-203 cross-toolchain comparison
        uses: actions/upload-artifact@v7
        with:
          name: r203-candidate-rich-cross-toolchain
          path: artifacts/r203-cross-toolchain.json
          if-no-files-found: error

  native-windows-arm64:
    name: Native / Windows ARM64 / MSVC
    runs-on: windows-11-arm
    steps:
      - uses: actions/checkout@v7
      - name: Configure
        run: >
          cmake -S native -B build/native
          -A ARM64
          -DRESONITH_WARNINGS_AS_ERRORS=ON
      - name: Build
        run: cmake --build build/native --config Release --parallel
      - name: Test
        shell: pwsh
        run: |
          $report = Join-Path $env:GITHUB_WORKSPACE "build/native/ctest-windows-arm64.xml"
          $output = @(& ctest --test-dir build/native `
            --build-config Release `
            --output-on-failure `
            --output-junit $report 2>&1)
          $status = $LASTEXITCODE
          $output | Write-Output
          if ($status -ne 0 -and (Test-Path -LiteralPath $report)) {
            [xml]$document = Get-Content -LiteralPath $report -Raw
            $cases = @($document.testsuite.testcase)
            $cases += @($document.testsuites.testsuite.testcase)
            foreach ($case in $cases) {
              $problem = if ($null -ne $case.failure) {
                $case.failure
              } else {
                $case.error
              }
              if ($null -ne $problem) {
                $detail = [string]$problem.InnerText
                $detail = ($detail -replace "[\r\n]+", " ").Trim()
                if ($detail.Length -gt 512) {
                  $detail = $detail.Substring(0, 512)
                }
                Write-Output "::error title=Windows ARM64 CTest $($case.name)::$detail"
              }
            }
          }
          if ($status -ne 0) {
            $tail = (($output | Select-Object -Last 12) -join " | ").Trim()
            $tail = $tail -replace "%", "%25"
            $tail = $tail -replace "`r", "%0D"
            $tail = $tail -replace "`n", "%0A"
            if ($tail.Length -gt 2048) {
              $tail = $tail.Substring(0, 2048)
            }
            Write-Output "::error title=Windows ARM64 CTest output::$tail"
          }
          exit $status

  native-android-arm64:
    name: Native / Android ARM64 / NDK
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Configure Android arm64-v8a
        run: >
          cmake -S native -B build/android-arm64
          -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK_ROOT/build/cmake/android.toolchain.cmake"
          -DANDROID_ABI=arm64-v8a
          -DANDROID_PLATFORM=android-24
          -DCMAKE_BUILD_TYPE=Release
          -DBUILD_TESTING=OFF
          -DRESONITH_WARNINGS_AS_ERRORS=ON
      - name: Build
        run: cmake --build build/android-arm64 --parallel
      - name: Publish Android arm64 callback benchmark
        uses: actions/upload-artifact@v7
        with:
          name: resonith-device-bench-android-arm64
          path: build/android-arm64/resonith_lapped_device_bench
          if-no-files-found: error
      - name: Publish Android arm64 adaptive entropy benchmark
        uses: actions/upload-artifact@v7
        with:
          name: resonith-finite-bench-android-arm64
          path: build/android-arm64/resonith_lapped_finite_bench
          if-no-files-found: error

  native-python-bridge:
    name: Native decoder-in-loop / Python
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Install runtime dependency
        run: python -m pip install -r requirements-research.txt
      - name: Build shared Golden Core
        run: |
          cmake -S native -B build/native \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_TESTING=OFF \
            -DRESONITH_WARNINGS_AS_ERRORS=ON
          cmake --build build/native \
            --target \
            resonith_core_shared \
            resonith_decode \
            resonith_lapped_device_bench \
            resonith_lapped_finite_bench \
            --parallel
      - name: Run native decoder-in-loop tests
        env:
          RESONITH_NATIVE_CORE: ${{ github.workspace }}/build/native/libresonith_core_shared.so
          RESONITH_NATIVE_DECODE: ${{ github.workspace }}/build/native/resonith_decode
          RESONITH_NATIVE_DEVICE_BENCH: ${{ github.workspace }}/build/native/resonith_lapped_device_bench
        run: >
          python -m unittest discover
          -s tests
          -p "test_native*.py"
          -v
      - name: Run R-191 native/oracle parity
        env:
          PYTHONPATH: ${{ github.workspace }}/reference:${{ github.workspace }}
          RESONITH_NATIVE_CORE: ${{ github.workspace }}/build/native/libresonith_core_shared.so
        run: >
          python -m pytest -q
          tests/test_partial_graph_fixed.py
          tests/test_r197_case_generator.py
          tests/test_r203_candidate_rich_generator.py
          tests/test_r203_compare_replays.py
      - name: Run complete R-197 exact-small JSONL replay
        env:
          PYTHONPATH: ${{ github.workspace }}/reference:${{ github.workspace }}
        run: |
          set -euo pipefail
          mkdir -p artifacts/r197
          python experiments/r197_partial_graph_gate.py \
            | tee artifacts/r197/exact-small-inventory.json
          python experiments/r197_partial_graph_native_gate.py \
            --inventory artifacts/r197/exact-small-inventory.json \
            --native-core build/native/libresonith_core_shared.so \
            | tee artifacts/r197/exact-small-native-replay.json
      - name: Publish R-197 exact-small evidence
        uses: actions/upload-artifact@v7
        with:
          name: r197-exact-small-native-replay
          path: |
            artifacts/r197/r197-exact-small-valid-v1.jsonl
            artifacts/r197/exact-small-inventory.json
            artifacts/r197/exact-small-native-replay.json
          if-no-files-found: error
      - name: Run complete R-203 candidate-rich exact replay
        env:
          PYTHONPATH: ${{ github.workspace }}/reference:${{ github.workspace }}
        run: |
          set -euo pipefail
          mkdir -p artifacts/r203
          python experiments/r203_candidate_rich_gate.py \
            | tee artifacts/r203/candidate-rich-inventory.json
          python experiments/r197_partial_graph_native_gate.py \
            --corpus artifacts/r203/r203-candidate-rich-exact-v1.jsonl \
            --inventory artifacts/r203/candidate-rich-inventory.json \
            --native-core build/native/libresonith_core_shared.so \
            | tee artifacts/r203/candidate-rich-native-replay.json
      - name: Publish R-203 candidate-rich evidence
        uses: actions/upload-artifact@v7
        with:
          name: r203-candidate-rich-native-replay
          path: |
            artifacts/r203/r203-candidate-rich-exact-v1.jsonl
            artifacts/r203/candidate-rich-inventory.json
            artifacts/r203/candidate-rich-native-replay.json
          if-no-files-found: error

  native-fuzz-smoke:
    name: Native / Clang / ASan+UBSan+libFuzzer
    runs-on: ubuntu-latest
    env:
      CC: clang
      CXX: clang++
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Install seed-generator dependency
        run: python -m pip install -r requirements-research.txt
      - name: Configure sanitized fuzz target
        run: >
          cmake -S native -B build/fuzz
          -DCMAKE_BUILD_TYPE=RelWithDebInfo
          -DBUILD_TESTING=OFF
          -DRESONITH_BUILD_FUZZERS=ON
          -DRESONITH_WARNINGS_AS_ERRORS=ON
      - name: Build sanitized fuzz target
        run: >
          cmake --build build/fuzz
          --target
          resonith_liftpack_fuzz
          resonith_main0_fuzz
          resonith_seek_fuzz
          resonith_lapped_fuzz
          resonith_lapped_packet_fuzz
          resonith_lapped_compact_fuzz
          resonith_lapped_finite_fuzz
          resonith_partial_graph_fuzz
          --parallel
      - name: Generate deterministic valid corpus
        run: python scripts/generate_fuzz_corpus.py artifacts/fuzz_corpus
      - name: Run bounded mutation smoke test
        run: >
          build/fuzz/resonith_liftpack_fuzz
          artifacts/fuzz_corpus/liftpack
          -runs=5000
          -max_len=65536
          -timeout=10
      - name: Run bounded Main-0 mutation smoke test
        run: >
          build/fuzz/resonith_main0_fuzz
          artifacts/fuzz_corpus/main0
          -runs=5000
          -max_len=65536
          -timeout=10
      - name: Run bounded seek-sidecar mutation smoke test
        run: >
          build/fuzz/resonith_seek_fuzz
          artifacts/fuzz_corpus/seek
          -runs=5000
          -max_len=65536
          -timeout=10
      - name: Run bounded lapped-stream mutation smoke test
        run: >
          build/fuzz/resonith_lapped_fuzz
          artifacts/fuzz_corpus/lapped
          -runs=5000
          -max_len=65536
          -timeout=10
      - name: Run bounded lapped-packet mutation smoke test
        run: >
          build/fuzz/resonith_lapped_packet_fuzz
          artifacts/fuzz_corpus/lapped_packet
          -runs=5000
          -max_len=65536
          -timeout=10
      - name: Run bounded compact-lapped mutation smoke test
        run: >
          build/fuzz/resonith_lapped_compact_fuzz
          artifacts/fuzz_corpus/lapped_compact
          -runs=5000
          -max_len=65536
          -timeout=10
      - name: Run bounded finite-state mutation smoke test
        run: >
          build/fuzz/resonith_lapped_finite_fuzz
          artifacts/fuzz_corpus/lapped_finite
          -runs=5000
          -max_len=65536
          -timeout=10
      - name: Run ABI-v3 partial-graph mutation smoke test
        run: >
          build/fuzz/resonith_partial_graph_fuzz
          -runs=5000
          -max_len=4096
          -timeout=10
