name: Lapped native benchmark

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/lapped-native-benchmark.yml"
      - "experiments/native_lapped_timing.py"
      - "experiments/native_lapped_analysis_timing.py"
      - "experiments/native_lapped_frontier_timing.py"
      - "experiments/native_lapped_packet_timing.py"
      - "experiments/lapped_packet_loss_gate.py"
      - "experiments/lapped_chained_packet_gate.py"
      - "experiments/lapped_realtime_frontier.py"
      - "experiments/real_music_corpus.json"
      - "native/**"
      - "reference/maf_p0/fixed_lapped.py"
      - "reference/maf_p0/lapped_oracle.py"
      - "reference/maf_p0/lapped_streaming.py"
      - "reference/maf_p0/native_core.py"
      - "reference/maf_p0/sparse_entropy.py"

permissions:
  contents: read

jobs:
  linux-x64-release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install runtime dependency
        run: python -m pip install numpy
      - name: Build release shared Core
        run: |
          cmake -S native -B build/native \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_TESTING=OFF \
            -DRESONITH_WARNINGS_AS_ERRORS=ON
          cmake --build build/native --target resonith_core_shared --parallel
      - name: Measure pinned real-music decode
        env:
          RESONITH_NATIVE_CORE: ${{ github.workspace }}/build/native/libresonith_core_shared.so
        run: >
          python experiments/native_lapped_timing.py
          --cache artifacts/real_music_source
          --maximum-seconds 1.0
          --iterations 10
          --warmups 2
          --output artifacts/lapped_native_timing/report.json
      - name: Measure pinned real-music forward analysis
        env:
          RESONITH_NATIVE_CORE: ${{ github.workspace }}/build/native/libresonith_core_shared.so
        run: >
          python experiments/native_lapped_analysis_timing.py
          --cache artifacts/real_music_source
          --maximum-seconds 1.0
          --native-iterations 10
          --python-iterations 3
          --warmups 2
          --output artifacts/lapped_native_analysis_timing/report.json
      - name: Measure native encoder RDO frontier
        env:
          RESONITH_NATIVE_CORE: ${{ github.workspace }}/build/native/libresonith_core_shared.so
        run: >
          python experiments/native_lapped_frontier_timing.py
          --cache artifacts/real_music_source
          --maximum-seconds 1.0
          --iterations 1
          --output artifacts/lapped_native_frontier_timing/report.json
      - name: Gate native packet pull resources
        env:
          RESONITH_NATIVE_CORE: ${{ github.workspace }}/build/native/libresonith_core_shared.so
        run: >
          python experiments/native_lapped_packet_timing.py
          --cache artifacts/real_music_source
          --maximum-seconds 3.0
          --packet-seconds 1.0
          --iterations 8
          --warmups 2
          --output artifacts/lapped_native_packet_timing/report.json
      - name: Gate native transform packet resources
        env:
          RESONITH_NATIVE_CORE: ${{ github.workspace }}/build/native/libresonith_core_shared.so
        run: >
          python experiments/native_lapped_packet_timing.py
          --cache artifacts/real_music_source
          --maximum-seconds 3.0
          --packet-seconds 0.25
          --packet-mode transform
          --iterations 8
          --warmups 2
          --output artifacts/lapped_native_transform_packet_timing/report.json
      - name: Gate native compact packet resources
        env:
          RESONITH_NATIVE_CORE: ${{ github.workspace }}/build/native/libresonith_core_shared.so
        run: >
          python experiments/native_lapped_packet_timing.py
          --cache artifacts/real_music_source
          --maximum-seconds 3.0
          --packet-seconds 0.04
          --packet-mode compact
          --iterations 8
          --warmups 2
          --output artifacts/lapped_native_compact_packet_timing/report.json
      - name: Gate lapped packet-loss containment
        run: >
          python experiments/lapped_packet_loss_gate.py
          --cache artifacts/real_music_source
          --maximum-seconds 3.0
          --packet-seconds 0.25
          --output artifacts/lapped_packet_loss/report.json
      - name: Gate single-owner transform packets
        run: >
          python experiments/lapped_chained_packet_gate.py
          --cache artifacts/real_music_source
          --maximum-seconds 3.0
          --packet-seconds 0.25
          --output artifacts/lapped_chained_packet/report.json
      - name: Measure Realtime latency and rate frontier
        run: >
          python experiments/lapped_realtime_frontier.py
          --cache artifacts/real_music_source
          --maximum-seconds 1.0
          --output artifacts/lapped_realtime_frontier/report.json
      - uses: actions/upload-artifact@v6
        with:
          name: lapped-native-timing-linux-x64
          path: artifacts/lapped_native_timing/report.json
          if-no-files-found: error
      - uses: actions/upload-artifact@v6
        with:
          name: lapped-native-analysis-timing-linux-x64
          path: artifacts/lapped_native_analysis_timing/report.json
          if-no-files-found: error
      - uses: actions/upload-artifact@v6
        with:
          name: lapped-native-frontier-timing-linux-x64
          path: artifacts/lapped_native_frontier_timing/report.json
          if-no-files-found: error
      - uses: actions/upload-artifact@v6
        with:
          name: lapped-native-packet-timing-linux-x64
          path: artifacts/lapped_native_packet_timing/report.json
          if-no-files-found: error
      - uses: actions/upload-artifact@v6
        with:
          name: lapped-native-transform-packet-timing-linux-x64
          path: artifacts/lapped_native_transform_packet_timing/report.json
          if-no-files-found: error
      - uses: actions/upload-artifact@v6
        with:
          name: lapped-native-compact-packet-timing-linux-x64
          path: artifacts/lapped_native_compact_packet_timing/report.json
          if-no-files-found: error
      - uses: actions/upload-artifact@v6
        with:
          name: lapped-packet-loss-linux-x64
          path: artifacts/lapped_packet_loss/report.json
          if-no-files-found: error
      - uses: actions/upload-artifact@v6
        with:
          name: lapped-chained-packet-linux-x64
          path: artifacts/lapped_chained_packet/report.json
          if-no-files-found: error
      - uses: actions/upload-artifact@v6
        with:
          name: lapped-realtime-frontier-linux-x64
          path: artifacts/lapped_realtime_frontier/report.json
          if-no-files-found: error
