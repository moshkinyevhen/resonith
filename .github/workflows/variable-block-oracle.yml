name: Variable Residual-Lifetime Oracle

on:
  workflow_dispatch:
    inputs:
      maximum_seconds:
        description: Maximum licensed crop duration per clip
        required: true
        default: "1"
      boundary_quantum:
        description: Encoder-only boundary lattice in samples
        required: true
        default: "512"

permissions:
  contents: read

jobs:
  oracle:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Install runtime dependency
        run: python -m pip install -r requirements-research.txt
      - name: Run exact-byte variable-lifetime oracle
        run: >
          python experiments/variable_block_oracle_benchmark.py
          --maximum-seconds ${{ inputs.maximum_seconds }}
          --boundary-quantum ${{ inputs.boundary_quantum }}
      - uses: actions/upload-artifact@v6
        with:
          name: variable-block-oracle-${{ github.sha }}
          path: artifacts/variable_block_oracle
          if-no-files-found: error
