name: Reversible Stereo-Lifting Oracle

on:
  workflow_dispatch:
    inputs:
      maximum_seconds:
        description: Maximum licensed crop duration per clip
        required: true
        default: "1"

permissions:
  contents: read

jobs:
  oracle:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Install runtime dependency
        run: python -m pip install -r requirements-research.txt
      - name: Run exact reversible stereo oracle
        run: >
          python experiments/stereo_lifting_oracle_benchmark.py
          --maximum-seconds ${{ inputs.maximum_seconds }}
      - uses: actions/upload-artifact@v6
        with:
          name: stereo-lifting-oracle-${{ github.sha }}
          path: artifacts/stereo_lifting_oracle
          if-no-files-found: error
