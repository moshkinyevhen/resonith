name: Additive Atom Compression Oracle

on:
  workflow_dispatch:
    inputs:
      maximum_seconds:
        description: Maximum licensed crop duration per clip
        required: true
        default: "1"

permissions:
  contents: read

jobs:
  oracle:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Install runtime dependency
        run: python -m pip install numpy
      - name: Run prospective full-byte additive oracle
        run: >
          python experiments/additive_atom_oracle_benchmark.py
          --maximum-seconds ${{ inputs.maximum_seconds }}
      - uses: actions/upload-artifact@v6
        with:
          name: additive-atom-oracle-${{ github.sha }}
          path: artifacts/additive_atom_oracle
          if-no-files-found: error
